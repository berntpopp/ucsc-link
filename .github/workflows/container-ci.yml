name: Container CI

on:
  pull_request:
    paths:
      - ucsc_link/**
      - docker/**
      - scripts/**
      - pyproject.toml
      - uv.lock
      - container-release.json
      - .github/workflows/container-ci.yml
  push:
    branches:
      - main
    paths:
      - ucsc_link/**
      - docker/**
      - scripts/**
      - pyproject.toml
      - uv.lock
      - container-release.json
      - .github/workflows/container-ci.yml

concurrency:
  group: container-ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  container-ci:
    uses: berntpopp/genefoundry-router/.github/workflows/_container-ci.yml@a5531cae3b8e69bd218ec6ca02c41eb160f6411d # genefoundry-router v0.13.17
