[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ucsc-link"
version = "0.3.0"
description = "MCP server for curated UCSC Genome Browser region tracks (genes, repeats, segmental duplications, problematic regions, conservation, ENCODE cCREs), bounded reference sequence, and self-hosted BLAT / in-silico PCR on hg38/hg19"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "ucsc-link contributors", email = "bernt.popp@charite.de" },
]
keywords = [
    "ucsc", "genome-browser", "hg38", "hg19", "repeatmasker", "segmental-duplication",
    "phylop", "conservation", "encode", "ccre", "reference-sequence", "blat", "in-silico-pcr",
    "mcp", "bioinformatics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]
# Unified fleet interpreter: CPython 3.14 is what the container ships
# (docker/Dockerfile) and what CI tests. Minor upgrades are a fleet migration.
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.52.3,<1.0.0",
    "pydantic>=2.13.5,<3.0.0",
    "pydantic-settings>=2.15.0,<3.0.0",
    "httpx>=0.28.0,<1.0.0",
    "structlog>=24.4.0,<27.0.0",
    "mcp[cli]>=1.30.0,<2.0.0",
    "fastmcp>=3.4.10,<4.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0,<10.0.0",
    "pytest-asyncio>=0.24.0,<2.0.0",
    "pytest-cov>=5.0.0,<8.0.0",
    "pytest-mock>=3.14.0,<4.0.0",
    "pytest-xdist>=3.6.0,<4.0.0",
    "respx>=0.21.0,<1.0.0",
    "ruff>=0.16.8,<1.0.0",
    "mypy>=2.3.1,<3.0.0",
    "pre-commit>=4.6.2,<5.0.0",
]

[project.urls]
Homepage = "https://github.com/berntpopp/ucsc-link"
Repository = "https://github.com/berntpopp/ucsc-link"
"Bug Tracker" = "https://github.com/berntpopp/ucsc-link/issues"

[project.scripts]
ucsc-link = "server:main"
ucsc-link-mcp = "mcp_server:main"
ucsc-link-blat-fetch = "ucsc_link.blat_fetch:main"

[tool.hatch.build.targets.wheel]
packages = ["ucsc_link"]
include = ["server.py", "mcp_server.py"]

[tool.ruff]
line-length = 100
target-version = "py314"
# Vendored byte-identical from genefoundry-router docs/conformance/ (never reformatted).
extend-exclude = ["tests/conformance/behaviour.py"]

[tool.ruff.lint]
# `select` (not `extend-select`): ruff 0.16 grows the implicit default rule set
# from 59 to 413 rules, so `extend-select` would silently inherit ~350 unopted
# rules. This list is already a superset of the pre-0.16 default (E4/E7/E9 + F),
# so the effective policy is byte-identical -- it is now explicit and pinned.
select = [
    "E", "W", "F", "I", "N", "UP", "B", "C4", "S", "T20", "SIM", "RUF",
]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "B008",   # FastAPI Query/Depends pattern
    "S101",   # asserts ok in tests (also per-file-ignores)
    "N812",   # single-letter module aliases
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S101", "S104", "S110", "S603", "T20", "B011", "SIM105", "SIM108"]
"mcp_server.py" = ["T20"]
"scripts/**/*" = ["T20"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
# Deliberately UNPINNED: mypy checks whatever interpreter runs it (CPython 3.14 in CI
# and the container), so symbols removed in 3.14 are still caught.
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
exclude = [
    ".*site-packages.*",
    ".*/\\.venv/.*",
    "htmlcov/.*",
]

[[tool.mypy.overrides]]
module = [
    "structlog.*",
    "mcp.*",
    "fastmcp.*",
    "fastapi.*",
    "pydantic.*",
    "pydantic_settings.*",
    "httpx.*",
    "uvicorn.*",
    "respx.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests that hit the live UCSC JSON API",
    "blat: real Kent gfServer/gfClient/gfPcr on a tiny genome (make test-blat)",
    "unit: marks tests as unit tests",
    "mcp: marks tests that test MCP functionality",
]

[tool.coverage.run]
source = ["ucsc_link"]
omit = ["tests/*", "*/.venv/*"]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
show_missing = true

[tool.coverage.html]
directory = "htmlcov"
